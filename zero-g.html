  const tg = phase === 'FLOAT' ? t.g : phase === 'PULLUP' ? 1.8 : 1.0;
  const tol = phase === 'FLOAT' ? tolerance() : 0.25;

  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU);
  ctx.fillStyle = 'rgba(4,10,14,0.38)'; ctx.fill();
  ctx.strokeStyle = C.soft; ctx.lineWidth = 1; ctx.stroke();

  /* g scale: horizontal is fore and aft, vertical is what pushes you down */
  for(let g=-1; g<=2; g++){
    const y = cy - (g-0)*s;
    if(Math.abs(y-cy) > R-4) continue;
    const half = g === 0 ? 10 : 5;
    line(cx-half, y, cx+half, y, C.soft, 1);
    if(g === 1) txt('1g', cx+half+4, y+3, C.soft, 9);
  }
  line(cx, cy-6, cx, cy+6, C.soft, 1);

  /* target ring */
  const ty = cy - tg*s, tr = Math.max(7, tol*s);
  ctx.beginPath(); ctx.arc(cx, ty, tr, 0, TAU);
  ctx.strokeStyle = phase === 'FLOAT' ? C.dir : C.dim;
  ctx.lineWidth = 2; ctx.setLineDash(phase === 'FLOAT' ? [] : [3,3]); ctx.stroke();
  ctx.setLineDash([]);

  /* where the aeroplane actually is */
  const gy = clamp(AP.gBody.y, -2.2, 3.2), gx = clamp(-AP.gBody.z, -2.2, 2.2);
  const dx = clamp(gx*s, -R+6, R-6), dy = clamp(-gy*s, -R+6, R-6);
  const err = vlen(vsub(AP.gBody, v3(0, tg, 0)));
  const col = err < tol ? C.good : err < tol*2.4 ? C.warn : C.bad;
  ctx.beginPath(); ctx.arc(cx+dx, cy+dy, 6, 0, TAU);
  ctx.fillStyle = col; ctx.fill();
  ctx.beginPath(); ctx.arc(cx+dx, cy+dy, 11, 0, TAU);
  ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.stroke();

  /* bank scale round the outside, with the roll pointer */
  const att = attitude();
  ctx.strokeStyle = C.dim; ctx.lineWidth = 1;
  for(const a of [-60,-45,-30,-20,-10,0,10,20,30,45,60]){
    const r0 = R+3, r1 = R + (a%30===0 ? 9 : 5);
    const th = -Math.PI/2 + a*DEG;
    line(cx+Math.cos(th)*r0, cy+Math.sin(th)*r0, cx+Math.cos(th)*r1, cy+Math.sin(th)*r1, C.dim, 1);
  }
  const rth = -Math.PI/2 - att.roll;
  ctx.beginPath();
  ctx.moveTo(cx+Math.cos(rth)*(R+2), cy+Math.sin(rth)*(R+2));
  ctx.lineTo(cx+Math.cos(rth+0.055)*(R+13), cy+Math.sin(rth+0.055)*(R+13));
  ctx.lineTo(cx+Math.cos(rth-0.055)*(R+13), cy+Math.sin(rth-0.055)*(R+13));
  ctx.closePath();
  ctx.fillStyle = Math.abs(att.roll) > 45*DEG ? C.warn : C.hud; ctx.fill();
  ctx.restore();

  const gTxt = (AP.gBody.y).toFixed(2);
  txt(gTxt + ' g', cx, cy - R - 16, col, 18*UI.scale + 6, 'center', 'middle', 'bold');
  txt((att.pitch/DEG >= 0 ? '+' : '') + (att.pitch/DEG).toFixed(0) + '\u00b0 pitch',
      cx, cy + R + 15, C.dim, 11, 'center', 'middle');
}

/* ---------- pitch ladder, drawn only when you are sitting up front ------- */
function drawLadder(){
  const att = attitude();
  const f = (UI.h/2) / Math.tan(hudFov*DEG/2);
  const cx = UI.w/2, cy = UI.h/2;
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(-att.roll);
  ctx.globalAlpha = 0.85;
  for(let a=-80; a<=80; a+=10){
    const dy = f*Math.tan(att.pitch - a*DEG);
    if(Math.abs(dy) > UI.h*0.62) continue;
    const half = a === 0 ? UI.w*0.34 : (a%20===0 ? 62 : 40);
    const col = a === 0 ? C.hud : C.dim;
    if(a === 0){
      line(-half, dy, -14, dy, col, 2); line(14, dy, half, dy, col, 2);
    } else {
      ctx.setLineDash(a < 0 ? [7,6] : []);
      line(-half, dy, -18, dy, col, 1.4); line(18, dy, half, dy, col, 1.4);
      ctx.setLineDash([]);
      txt((a>0?'+':'') + a, -half-6, dy+4, col, 11, 'right');
      txt((a>0?'+':'') + a,  half+6, dy+4, col, 11, 'left');
    }
  }
  ctx.restore();

  /* velocity vector — where the aeroplane is actually going */
  const V = vlen(AP.vel);
  if(V > 20){
    const p = projectDir(vmul(AP.vel, 1/V));
    if(p && p.x > 0 && p.x < UI.w && p.y > 0 && p.y < UI.h){
      ctx.beginPath(); ctx.arc(p.x, p.y, 7, 0, TAU);
      ctx.strokeStyle = C.hud; ctx.lineWidth = 1.6; ctx.stroke();
      line(p.x-14, p.y, p.x-7, p.y, C.hud, 1.6);
      line(p.x+7, p.y, p.x+14, p.y, C.hud, 1.6);
      line(p.x, p.y-7, p.x, p.y-13, C.hud, 1.6);
    }
  }
  /* the aeroplane symbol never moves */
  line(cx-30, cy, cx-10, cy, C.white, 2);
  line(cx+10, cy, cx+30, cy, C.white, 2);
  line(cx, cy-1, cx, cy+6, C.white, 2);
}

/* ---------- numbers down the sides --------------------------------------- */
function readout(x, y, w, label, value, sub, col){
  panel(x, y, w, 46, 7);
  txt(label, x+8, y+13, C.dim, 10);
  txt(value, x+w-8, y+27, col || C.white, 21, 'right', 'alphabetic', 'bold');
  if(sub) txt(sub, x+8, y+39, C.dim, 10);
}
function drawSides(){
  const s = UI.scale, att = attitude();
  const iasKt = AP.ias/KT, altFt = AP.pos.y/FT, vs = AP.vel.y/FT*60;
  const fast = AP.ias > AC.iasMax*0.94 || AP.mach > AC.mMax*0.97;
  const inBlock = AP.pos.y > CFG.blockLow && AP.pos.y < CFG.blockHigh;

  if(UI.compact){
    /* one thin strip of numbers — a short screen has no room for boxes */
    const items = [
      ['IAS',  iasKt.toFixed(0), fast ? C.bad : AP.stalled ? C.warn : C.white],
      ['M',    AP.mach.toFixed(2), fast ? C.bad : C.white],
      ['ALT',  '' + Math.round(altFt/10)*10, inBlock ? C.white : C.warn],
      ['V/S',  (vs>=0?'+':'') + Math.round(vs/100)*100, C.white],
      ['AoA',  (AP.alpha/DEG).toFixed(1) + '°', AP.stalled ? C.warn : C.white],
      ['THR',  (AP.throttle*100).toFixed(0) + '%', C.white],
      ['FUEL', (AP.fuel/1000).toFixed(1) + 't', AP.fuel < 1200 ? C.warn : C.white],
    ];
    let total = 16;
    for(const it of items){
      font(10);          total += ctx.measureText(it[0]).width + 4;
      font(12, 'bold');  total += ctx.measureText(it[1]).width + 12;
    }
    const y = UI.midY;
    panel(UI.L, y, total, 24, 6);
    let x = UI.L + 8;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    for(const it of items){
      font(10); ctx.fillStyle = C.dim;
      ctx.fillText(it[0], x, y+16); x += ctx.measureText(it[0]).width + 4;
      font(12, 'bold'); ctx.fillStyle = it[2];
      ctx.fillText(it[1], x, y+16); x += ctx.measureText(it[1]).width + 12;
    }
    return;
  }

  const w = clamp(118*s, 92, 132), midY = UI.midY;
  readout(UI.L, midY, w, 'IAS  KT', iasKt.toFixed(0), 'MACH ' + AP.mach.toFixed(3),
          fast ? C.bad : AP.stalled ? C.warn : C.white);
  readout(UI.L, midY+56, w, 'THR / FUEL', (AP.throttle*100).toFixed(0)+'%',
          (AP.fuel/1000).toFixed(1) + ' t left', AP.fuel < 1200 ? C.warn : C.white);
  readout(UI.R-w, midY, w, 'ALT  FT', '' + Math.round(altFt/10)*10,
          inBlock ? 'in block' : AP.pos.y < CFG.blockLow ? 'BELOW BLOCK' : 'ABOVE BLOCK',
          inBlock ? C.white : C.warn);
  readout(UI.R-w, midY+56, w, 'V/S  FPM', (vs>=0?'+':'') + Math.round(vs/50)*50,
          'FPA ' + (att.gamma/DEG).toFixed(0) + '°');

}

/* ---------- banner, guidance, score -------------------------------------- */
function drawTopStrip(){
  const s = UI.scale, w = UI.scoreW, h = UI.scoreH;
  panel(UI.L, UI.T, w, h, 7);
  txt('SCORE ' + game.score, UI.L+9, UI.T+h*0.68, C.hud, clamp(13*s,11,15), 'left', 'alphabetic', 'bold');
  txt(Math.min(game.index+1, PROFILE.length) + '/' + PROFILE.length,
      UI.L + w - 9, UI.T+h*0.68, C.dim, clamp(11*s,10,12), 'right');
}

function drawBanner(){
  const cx = UI.w/2, T = UI.bannerY, s = UI.scale;
  let head, sub, col = C.hud;
  if(game.phase === 'CRUISE'){ head = game.done ? 'PROFILE COMPLETE' : 'SET UP — ' + target().name; sub = game.readyWhy; col = game.ready ? C.good : C.hud; }
  else if(game.phase === 'PULLUP'){ head = 'PULL UP'; sub = 'hold 1.8 g to 45 degrees nose high'; col = C.warn; }
  else if(game.phase === 'FLOAT'){
    const c = game.cur, t = target();
    head = t.name + '  ' + c.good.toFixed(1) + ' s';
    sub = 'hold the ball in the ring';
    col = C.good;
  }
  else { head = 'RECOVER'; sub = 'wings level, back into the block'; col = C.warn; }

  const w = clamp(300*s, 226, 380), h = UI.bannerH;
  panel(cx-w/2, T, w, h, 8);
  txt(head, cx, T+h*0.44, col, clamp(15*s,12,17), 'center', 'middle', 'bold');
  txt(sub,  cx, T+h*0.78, C.dim, clamp(11*s,9.5,12), 'center', 'middle');

  /* how much of the parabola you have banked */
  if(game.phase === 'FLOAT'){
    const t = target(), c = game.cur;
    const bw = w-20, bx = cx-bw/2, by = T+h+6;
    panel(bx, by, bw, 12, 6, 'rgba(5,11,14,0.5)');
    const f = clamp(c.good/t.secs, 0, 1);
    rrect(bx+1, by+1, Math.max(2, (bw-2)*f), 10, 5);
    ctx.fillStyle = C.good; ctx.fill();
    txt(t.secs + 's target', cx, by+10, 'rgba(5,11,14,0.9)', 9, 'center');
  }
}

function drawWarnings(){
  const cx = UI.w/2, y0 = UI.bannerY + UI.bannerH + 26;
  const list = [];
  if(AP.broken) list.push(['AIRFRAME FAILURE', C.bad]);
  if(Math.abs(AP.nz) > AC.gLimit) list.push([Math.abs(AP.nz).toFixed(1) + ' G — EASE OFF', C.bad]);
  if(AP.mach > AC.mMax || AP.ias > AC.iasMax) list.push(['OVERSPEED', C.bad]);
  if(AP.stalled) list.push(['STALL', C.warn]);
  if(AP.pos.y < CFG.blockLow) list.push(['BELOW BLOCK', C.warn]);
  if(AP.pos.y < 2200) list.push(['TERRAIN — PULL UP', C.bad]);
  if(AP.pos.y > CFG.blockHigh) list.push(['ABOVE BLOCK', C.warn]);
  if(AP.fuel < 900) list.push(['FUEL LOW', C.warn]);
  const blink = (world.t*3.4|0)%2 === 0;
  let y = y0;
  for(const [t, c] of list.slice(0,3)){
    if(c === C.bad && !blink) { y += 24; continue; }
    font(13, 'bold');
    const tw = ctx.measureText(t).width + 20;
    panel(cx-tw/2, y, tw, 20, 5, 'rgba(30,6,6,0.72)');
    txt(t, cx, y+14, c, 13, 'center', 'alphabetic', 'bold');
    y += 24;
  }
}

function drawMessages(){
  let y = UI.msgY, n = 0;
  for(let i=game.msgs.length-1; i>=0 && n<3; i--){
    const m = game.msgs[i];
    const a = clamp(1 - (m.t-4)/2, 0, 1);
    if(a <= 0) continue;
    ctx.globalAlpha = a;
    txt(m.text, UI.L, y, m.kind === 'good' ? C.good : C.dim, 11.5, 'left');
    ctx.globalAlpha = 1;
    y += 16; n++;
  }
}

function drawReport(){
  if(!game.report || game.reportT <= 0) return;
  const r = game.report, s = UI.scale;
  const w = clamp(230*s, 190, 260), h = 128;
  const x = UI.compact ? UI.w/2 - w/2 : UI.R - w;
  const y = UI.compact ? UI.midY + 30 : UI.midY + 120;
  const a = clamp(game.reportT, 0, 1);
  ctx.globalAlpha = a;
  panel(x, y, w, h, 8, C.deep);
  txt(r.name + ' — ' + r.grade, x+10, y+20, r.pts > 0 ? C.good : C.warn, 13, 'left', 'alphabetic', 'bold');
  const row = (i, k, v) => { txt(k, x+10, y+40+i*17, C.dim, 11); txt(v, x+w-10, y+40+i*17, C.white, 11, 'right'); };
  row(0, 'in tolerance', r.secs.toFixed(1) + ' s');
  row(1, 'longest run',  r.best.toFixed(1) + ' s');
  row(2, 'smoothness',   (r.quality*100).toFixed(0) + '%');
  row(3, 'cabin bumps',  '' + r.bumps);
  txt('+' + r.pts, x+w-10, y+h-10, C.good, 17, 'right', 'alphabetic', 'bold');
  txt(r.why, x+10, y+h-10, C.dim, 10);
  ctx.globalAlpha = 1;
}

/* ---------- the touch furniture ------------------------------------------ */
function drawButton(b, active){
  panel(b.x, b.y, b.w, b.h, 9, active ? 'rgba(20,60,44,0.8)' : C.ink);
  txt(b.label, b.x+b.w/2, b.y+b.h/2+1, active ? C.good : C.hud, 12, 'center', 'middle', 'bold');
}
function drawControls(){
  for(const b of UI.btns){
    const active = (b.id === 'pause' && game.paused) || (b.id === 'sound' && game.muted) ||
                   (b.id === 'help' && game.help);
    drawButton(b, active);
    if(b.id === 'sound' && game.muted) line(b.x+10, b.y+10, b.x+b.w-10, b.y+b.h-10, C.bad, 2);
    if(b.id === 'view') txt(['CHASE','DECK','CABIN'][game.view], b.x+b.w/2, b.y+b.h-4, C.dim, 8, 'center');
  }
  /* on a keyboard the stick is only drawn while you are dragging it */
  if(!UI.showTouch && !mouseFly.on) return;

  const s = UI.stick;
  ctx.save();
  ctx.globalAlpha = s.active ? 0.95 : 0.5;
  ctx.beginPath(); ctx.arc(s.cx, s.cy, s.r, 0, TAU);
  ctx.strokeStyle = C.dim; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.beginPath(); ctx.arc(s.cx, s.cy, s.r*0.5, 0, TAU);
  ctx.strokeStyle = C.soft; ctx.lineWidth = 1; ctx.stroke();
  line(s.cx-s.r, s.cy, s.cx-s.r*0.75, s.cy, C.soft, 1);
  line(s.cx+s.r*0.75, s.cy, s.cx+s.r, s.cy, C.soft, 1);
  line(s.cx, s.cy-s.r, s.cx, s.cy-s.r*0.75, C.soft, 1);
  line(s.cx, s.cy+s.r*0.75, s.cx, s.cy+s.r, C.soft, 1);
  /* where the director would like your thumb to be */
  if(ASSIST[game.assist].director && game.state === 'fly'){
    const stickY = clamp(directorStick(), -1, 1);
    ctx.beginPath();
    ctx.arc(s.cx, s.cy + stickY*s.r, 9, 0, TAU);
    ctx.strokeStyle = C.dir; ctx.lineWidth = 2; ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(s.cx + s.dx*s.r, s.cy + s.dy*s.r, 20, 0, TAU);
  ctx.fillStyle = s.active ? 'rgba(121,247,180,0.30)' : 'rgba(121,247,180,0.14)';
  ctx.fill();
  ctx.strokeStyle = C.hud; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
  txt('PULL', s.cx, s.cy + s.r - 8, C.soft, 9, 'center');
  txt('PUSH', s.cx, s.cy - s.r + 14, C.soft, 9, 'center');

  /* throttle */
  const t = UI.thr;
  panel(t.x, t.y, t.w, t.h, 10, 'rgba(5,11,14,0.55)');
  const fh = t.h*clamp(AP.throttle,0,1);
  rrect(t.x+3, t.y + t.h - fh + 1, t.w-6, Math.max(2, fh-4), 8);
  ctx.fillStyle = 'rgba(121,247,180,0.28)'; ctx.fill();
  const ky = t.y + t.h - fh;
  line(t.x+2, ky, t.x+t.w-2, ky, C.hud, 2.5);
  txt('THR', t.x+t.w/2, t.y-6, C.dim, 10, 'center');
  txt((AP.throttle*100).toFixed(0), t.x+t.w/2, t.y+t.h+13, C.hud, 12, 'center', 'alphabetic', 'bold');

  if(UI.rud.l){ drawButton(UI.rud.l, UI.rud.dir<0); drawButton(UI.rud.r, UI.rud.dir>0); }
}

/* ---------- picture in picture, and the cabin's mood --------------------- */
function drawPip(){
  if(game.view === 2 || !UI.pip || game.state !== 'fly') return;
  const r = UI.pip;
  ctx.save();
  rrect(r.x, r.y, r.w, r.h, 8);
  ctx.strokeStyle = CABIN.jolt > 0.2 ? C.bad : C.soft;
  ctx.lineWidth = CABIN.jolt > 0.2 ? 2 : 1;
  ctx.stroke();
  ctx.fillStyle = 'rgba(4,9,13,0.5)';
  ctx.fillRect(r.x+1, r.y+1, r.w-2, 18);
  txt('CABIN', r.x+7, r.y+14, C.dim, 10);
  const floating = CABIN.people.filter(p => !p.grounded).length;
  if(r.w > 150){
    txt(floating + '/' + CABIN.people.length + ' floating', r.x+r.w-7, r.y+14,
        floating > 5 ? C.good : C.dim, 10, 'right');
  } else if(floating){
    txt('' + floating, r.x+r.w-7, r.y+14, floating > 5 ? C.good : C.dim, 10, 'right');
  }
  if(CABIN.bumps) txt(CABIN.bumps + ' bumps', r.x+r.w-7, r.y+r.h-7, C.warn, 10, 'right');
  ctx.restore();
}

/* ---------- cockpit surround --------------------------------------------- */
function drawDeckFrame(){
  const w = UI.w, h = UI.h;
  ctx.save();
  ctx.fillStyle = 'rgba(7,10,14,0.95)';
  ctx.beginPath();
  ctx.moveTo(0,h); ctx.lineTo(0, h*0.80);
  ctx.quadraticCurveTo(w*0.5, h*0.94, w, h*0.80);
  ctx.lineTo(w, h); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(150,180,200,0.30)'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, h*0.80); ctx.quadraticCurveTo(w*0.5, h*0.94, w, h*0.80);
  ctx.stroke();
  ctx.fillStyle = 'rgba(7,10,14,0.55)';
  ctx.fillRect(0, 0, w, h*0.05);
  ctx.strokeStyle = 'rgba(150,180,200,0.22)'; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(w*0.5, h*0.05); ctx.lineTo(w*0.5, h*0.86);
  ctx.stroke();
  ctx.restore();
}

/* ==========================================================================
   SCREENS
   ========================================================================== */
function dim(a){ ctx.fillStyle = 'rgba(3,6,9,' + a + ')'; ctx.fillRect(0,0,UI.w,UI.h); }

/* break a sentence to fit the width we actually have */
function wrap(text, maxW, px){
  font(px);
  const words = text.split(' '), out = [];
  let cur = '';
  for(const w of words){
    const t = cur ? cur + ' ' + w : w;
    if(ctx.measureText(t).width > maxW && cur){ out.push(cur); cur = w; }
    else cur = t;
  }
  if(cur) out.push(cur);
  return out;
}

function drawMenu(){
  dim(0.42);
  const cx = UI.w/2, s = UI.scale;
  const tall = UI.h > 560;
  let y = UI.h*(tall ? 0.16 : 0.10);
  txt('ZERO G', cx, y, C.white, clamp(58*s, 34, 72), 'center', 'alphabetic', 'bold');
  y += clamp(22*s, 16, 26);
  txt('PARABOLIC FLIGHT  ·  BOEING 727-200', cx, y, C.hud, clamp(13*s, 10, 15), 'center');
  y += clamp(34*s, 24, 40);
  const blurb = 'The aeroplane the weightless-flight outfits use is an old three-holer 727. ' +
                'Climb into a 45\u00b0 pull, push over the top, and for half a minute the cabin ' +
                'behind you is in free fall. Keep the ball in the ring and nobody gets hurt.';
  const bp = clamp(12*s, 9.5, 13);
  for(const l of wrap(blurb, Math.min(UI.w - 40, 620), bp)){
    txt(l, cx, y, C.dim, bp, 'center'); y += clamp(18*s, 14, 20);
  }

  /* assist chips */
  y += clamp(14*s, 8, 18);
  txt('ASSIST', cx, y, C.dim, 11, 'center'); y += 10;
  const cw = clamp(124*s, 92, 140), ch = clamp(34*s, 28, 38), gap = 8;
  const total = cw*3 + gap*2;
  UI.chips = [];
  for(let i=0;i<3;i++){
    const x = cx - total/2 + i*(cw+gap);
    const on = game.assist === i;
    panel(x, y, cw, ch, 8, on ? 'rgba(18,64,46,0.85)' : C.ink);
    txt((i+1) + '  ' + ASSIST[i].name, x+cw/2, y+ch*0.68, on ? C.good : C.hud,
        clamp(12*s,10,13), 'center', 'alphabetic', 'bold');
    UI.chips.push({ x, y, w:cw, h:ch, i });
  }
  y += ch + clamp(16*s, 13, 18);
  txt(ASSIST[game.assist].label, cx, y, C.dim, clamp(11*s, 9.5, 12), 'center');
  y += clamp(24*s, 17, 28);

  const go = IS_TOUCH ? 'TAP ANYWHERE TO FLY' : 'PRESS ENTER TO FLY';
  const blink = (world.t*1.6|0)%2 === 0;
  txt(go, cx, y, blink ? C.good : C.dim, clamp(16*s, 12, 18), 'center', 'alphabetic', 'bold');
  y += clamp(30*s, 20, 34);

  if(IS_TOUCH && UI.h > UI.w){
    txt('turn the phone sideways for more sky', cx, y, C.dim, clamp(11*s, 9, 12), 'center');
    y += clamp(20*s, 15, 22);
  }
  const ctrl = IS_TOUCH
    ? ['left thumb — stick: drag DOWN to pull the nose up', 'right edge — throttle', 'buttons — camera, pause, sound, help']
    : ['↑ / W push   ↓ / S pull   ← → / A D roll   Q E rudder',
       'SHIFT / CTRL throttle   ·   C camera   P pause   M sound   H help',
       'or hold the left mouse button and fly it like a stick'];
  for(const l of ctrl){ txt(l, cx, y, C.dim, clamp(11*s, 9, 12), 'center'); y += clamp(16*s, 13, 18); }
}

function drawOver(){
  dim(0.62);
  const cx = UI.w/2, s = UI.scale;
  let y = UI.h*0.24;
  const won = game.deadWhy === 'profile complete';
  txt(won ? 'PROFILE COMPLETE' : 'FLIGHT OVER', cx, y, won ? C.good : C.bad,
      clamp(34*s, 22, 40), 'center', 'alphabetic', 'bold');
  y += clamp(26*s, 18, 30);
  txt(game.deadWhy || '', cx, y, C.dim, clamp(13*s, 10, 14), 'center');
  y += clamp(34*s, 24, 40);
  const rows = [
    ['score', '' + game.score],
    ['weightless time', game.floatTotal.toFixed(1) + ' s'],
    ['parabolas flown', Math.min(game.index, PROFILE.length) + ' of ' + PROFILE.length],
    ['cabin bumps', '' + game.bumps],
  ];
  const w = clamp(280*s, 220, 320);
  for(const [k, v] of rows){
    txt(k, cx - w/2, y, C.dim, clamp(13*s,11,14), 'left');
    txt(v, cx + w/2, y, C.white, clamp(13*s,11,14), 'right', 'alphabetic', 'bold');
    y += clamp(22*s, 18, 24);
  }
  y += clamp(20*s, 14, 24);
  const blink = (world.t*1.6|0)%2 === 0;
  txt(IS_TOUCH ? 'TAP TO GO AGAIN' : 'ENTER TO GO AGAIN', cx, y, blink ? C.good : C.dim,
      clamp(15*s, 12, 17), 'center', 'alphabetic', 'bold');
}

function drawHelp(){
  dim(0.72);
  const cx = UI.w/2, s = UI.scale;
  let y = UI.h*0.13;
  txt('HOW TO FLY A PARABOLA', cx, y, C.white, clamp(20*s,15,23), 'center', 'alphabetic', 'bold');
  y += clamp(26*s,18,30);
  const steps = [
    ['1  SET UP', '24,000 ft, 300 kt indicated, wings level.'],
    ['2  PULL',   'Ease back until the ball sits on the 1.8 g mark. Hold it to 45° nose high.'],
    ['3  PUSH',   'Over the top, push forward and keep pushing — the ball belongs in the ring.'],
    ['4  THROTTLE','Drag still pushes you back. Come back to near idle so the ball centres sideways too.'],
    ['5  RECOVER','By 30° nose down, pull out at about 1.8 g. Do not exceed 2.6 g or the speed limit.'],
  ];
  for(const [k, v] of steps){
    txt(k, cx - clamp(260*s,200,290)/2, y, C.hud, clamp(12*s,10,13), 'left', 'alphabetic', 'bold');
    y += clamp(16*s,13,18);
    txt(v, cx - clamp(260*s,200,290)/2, y, C.dim, clamp(11.5*s,9.5,12.5), 'left');
    y += clamp(22*s,17,24);
  }
  y += 6;
  txt('Mars is 0.38 g and the Moon is 0.17 g — the ring moves, the job does not.',
      cx, y, C.dim, clamp(11*s,9,12), 'center');
  y += clamp(26*s,18,28);
  txt(IS_TOUCH ? 'TAP TO CLOSE' : 'H TO CLOSE', cx, y, C.good, clamp(13*s,11,14), 'center');
}

function drawPause(){
  dim(0.55);
  txt('PAUSED', UI.w/2, UI.h/2 - 8, C.white, clamp(30*UI.scale,22,34), 'center', 'middle', 'bold');
  txt(IS_TOUCH ? 'tap to resume' : 'P to resume', UI.w/2, UI.h/2 + 22, C.dim, 13, 'center', 'middle');
}

function drawHUD(){
  ctx.clearRect(0, 0, UI.w, UI.h);
  ctx.lineJoin = 'round';
  if(game.state === 'fly' || game.state === 'over'){
    if(game.view === 1){ drawLadder(); drawDeckFrame(); }
    if(game.state === 'fly'){
      drawTopStrip(); drawBanner(); drawSides(); drawWarnings();
      const ballY = game.view === 1 ? UI.h*0.38 : UI.ballY;
      drawGBall(UI.w/2, ballY, UI.ballR);
      if(!UI.showTouch) drawStickGauge(UI.w/2 + UI.ballR + 26, ballY, UI.ballR);
      drawMessages(); drawReport(); drawPip(); drawControls();
      if(CABIN.jolt > 0.05){
        ctx.fillStyle = 'rgba(255,90,90,' + (CABIN.jolt*0.16).toFixed(3) + ')';
        ctx.fillRect(0,0,UI.w,UI.h);
      }
      if(game.help) drawHelp();
      else if(game.paused) drawPause();
    }
  }
  if(game.state === 'menu') drawMenu();
  if(game.state === 'over') drawOver();
  if(DEBUG){
    txt('fps ' + fpsShown.toFixed(0) + '  rscale ' + UI.rscale.toFixed(2) + '  tri ' + (MESH.plane.count/3|0),
        UI.safe.l + 8, UI.h - UI.safe.b - 6, C.dim, 10);
  }
}

/* ==========================================================================
   LOOP
   ========================================================================== */
function qLook(dir, upHint){
  const f = vnorm(dir);
  let r = vcross(f, upHint || v3(0,1,0));
  if(vlen(r) < 1e-4) r = vcross(f, v3(1,0,0));
  r = vnorm(r);
  const u = vcross(r, f);
  const m00=r.x, m10=r.y, m20=r.z, m01=u.x, m11=u.y, m21=u.z, m02=-f.x, m12=-f.y, m22=-f.z;
  const tr = m00+m11+m22;
  let q;
  if(tr > 0){
    const S = Math.sqrt(tr+1)*2;
    q = { w:0.25*S, x:(m21-m12)/S, y:(m02-m20)/S, z:(m10-m01)/S };
  } else if(m00 > m11 && m00 > m22){
    const S = Math.sqrt(1+m00-m11-m22)*2;
    q = { w:(m21-m12)/S, x:0.25*S, y:(m01+m10)/S, z:(m02+m20)/S };
  } else if(m11 > m22){
    const S = Math.sqrt(1+m11-m00-m22)*2;
    q = { w:(m02-m20)/S, x:(m01+m10)/S, y:0.25*S, z:(m12+m21)/S };
  } else {
    const S = Math.sqrt(1+m22-m00-m11)*2;
    q = { w:(m10-m01)/S, x:(m02+m20)/S, y:(m12+m21)/S, z:0.25*S };
  }
  return qnorm(q);
}

function demoStep(dt){
  const att = attitude();
  const wantPitch = clamp((CFG.entryAlt - AP.pos.y)*0.00006, -0.06, 0.08);
  CTL.pitch = clamp((wantPitch - att.pitch)*2.6 - AP.w.x*2.2, -0.45, 0.45);
  const wantRoll = 0.20*Math.sin(world.t*0.10);
  CTL.roll = clamp(-((wantRoll - att.roll)*1.7 + AP.w.z*0.9), -0.45, 0.45);
  CTL.yaw = 0;
  AP.throttle = 0.80;
  if(AP.fuel < AC.fuel*0.5) AP.fuel = AC.fuel;
}

function step(dt){
  world.t += dt;
  if(game.state === 'menu'){
    demoStep(dt); flyStep(dt); cabinStep(dt); trailStep(dt); recycleClouds();
  } else if(game.state === 'fly'){
    if(!game.paused && !game.help){
      keyboardStep(dt);
      flyStep(dt); cabinStep(dt); trailStep(dt); missionStep(dt);
      recycleClouds(); alarms(dt);
    }
  } else if(game.state === 'over'){
    if(AP.pos.y > 30){ flyStep(dt); cabinStep(dt); trailStep(dt); }
    else { AP.vel = vmul(AP.vel, Math.max(0, 1-dt*4)); AP.pos.y = Math.max(6, AP.pos.y); }
  }
  updateCamera(dt);
  audioStep();
}

/* if the device cannot keep up, render fewer pixels rather than fewer frames */
let slowFor = 0;
function adaptQuality(dt){
  if(fpsShown <= 0) return;
  slowFor = fpsShown < 42 ? slowFor + dt : 0;
  if(slowFor > 2.5 && UI.rscale > 0.6){
    UI.rscale = Math.max(0.6, UI.rscale - 0.15);
    slowFor = 0;
    resize();
  }
}

let lastT = 0, fpsAcc = 0, fpsN = 0, fpsShown = 0;
function frame(now){
  requestAnimationFrame(frame);
  if(!lastT){ lastT = now; return; }
  let dt = (now - lastT)/1000;
  lastT = now;
  if(dt > 0.25) dt = 0.25;
  fpsAcc += dt; fpsN++;
  if(fpsAcc > 0.5){ fpsShown = fpsN/fpsAcc; fpsAcc = 0; fpsN = 0; }
  adaptQuality(dt);
  /* fixed-ish substeps keep the physics honest when a frame runs long */
  let left = clamp(dt, 0.0005, 0.10);
  while(left > 0){
    const h = Math.min(left, 1/90);
    step(h);
    left -= h;
  }
  render();
  drawHUD();
}

resize();
resetRun();
game.state = 'menu';
requestAnimationFrame(frame);
</script>
